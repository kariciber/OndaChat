name: OndaChat Android v2 (sin firma)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Generar proyecto Android desde la configuracion v2
        run: |
          mkdir -p android
          cp android-v2/twa-manifest.json android/twa-manifest.json
          bubblewrap update --manifest=android/twa-manifest.json

      - name: Confirmar identificador y version antes de compilar
        run: |
          grep -q "com.kharb.ondachat" android/app/build.gradle
          grep -q "versionCode 2" android/app/build.gradle
          grep -q "versionName '1.0.1'" android/app/build.gradle
          grep -q "enableSiteSettingsShortcut: true" android/app/build.gradle || grep -q "enableSiteSettingsShortcut: 'true'" android/app/build.gradle
          echo "Identificador y version verificados en build.gradle"

      - name: Compilar AAB sin firmar
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Guardar AAB como archivo descargable de Actions
        uses: actions/upload-artifact@v4
        with:
          name: OndaChat-v1.0.1-code2-SIN-FIRMA
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
